<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Kriptografi – Escape From The Lost Forest</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Victory Screen -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- QRCode Generator JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: {
                            950: '#040b07',
                            900: '#091e13',
                            800: '#123524',
                            700: '#1b4d35',
                            600: '#276749',
                            500: '#38a169',
                            accent: '#e2e8f0',
                            gold: '#fbbf24',
                            danger: '#ef4444'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #06110b;
            background-image: radial-gradient(circle at 50% 20%, #123524 0%, #06110b 80%);
            min-height: 100vh;
            color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(18, 53, 36, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glow-gold {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .glow-green {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .selected-item {
            border-color: #fbbf24 !important;
            background-color: rgba(251, 191, 36, 0.15) !important;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen justify-between selection:bg-emerald-500 selection:text-white">

    <header class="w-full bg-forest-900/90 border-b border-forest-600/30 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-forest-700/50 rounded-lg text-emerald-400">
                    <i class="fa-solid fa-compass text-xl"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-emerald-400 tracking-wider uppercase">Misi Kriptografi</h1>
                    <p class="text-xs text-slate-300 hidden sm:block">Hutan Simpan Rimba Damai</p>
                </div>
            </div>

            <!-- GAMIFICATION STATS HEADER -->
            <div id="statsBar" class="flex items-center gap-4 bg-forest-800/80 px-4 py-1.5 rounded-full border border-forest-600/40 text-sm">
                <!-- NYAWA & HAD KESALAHAN -->
                <div class="flex items-center gap-1.5" title="Nyawa & Had Kesalahan">
                    <span class="text-lg">🧭</span>
                    <span id="livesDisplay" class="font-bold text-amber-400">5</span>
                    <span class="text-xs text-slate-400">Nyawa</span>
                    <span id="wrongDisplay" class="text-xs font-semibold text-rose-400 ml-1">(Salah: 0/3)</span>
                </div>
                <div class="h-4 w-[1px] bg-forest-600/50"></div>
                <!-- MARKAH -->
                <div class="flex items-center gap-1.5" title="Markah">
                    <span class="text-lg">⭐</span>
                    <span id="scoreDisplay" class="font-bold text-emerald-400">0</span>
                    <span class="text-xs text-slate-400">Pts</span>
                </div>
                <div class="h-4 w-[1px] bg-forest-600/50"></div>
                <!-- KOD RAHSIA -->
                <div class="flex items-center gap-1 text-xs">
                    <span class="text-slate-400 font-semibold mr-1">Kod:</span>
                    <span id="codeInventory" class="font-mono tracking-widest text-emerald-300 font-bold">_ _ _ _ _</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 my-auto flex-grow flex flex-col justify-center">
        <!-- Toast Notification Overlay -->
        <div id="toast" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-2xl text-center text-sm font-bold transition-all duration-300"></div>

        <!-- Dynamic Game Screens Container -->
        <div id="gameScreen" class="glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <!-- Content dynamically rendered via JS -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-forest-800/40 bg-forest-900/50">
        Misi Kriptografi: Escape From The Lost Forest &copy; 2026 | Modul Pendidikan Kriptografi
    </footer>

    <script>
        const gameState = {
            currentPage: 1,
            lives: 5,
            wrongCount: 0,
            score: 0,
            codes: ['_', '_', '_', '_', '_'],
            targetCodes: ['8', '3', '5', '1', '9'],
            badges: [],
            hintsUsed: [false, false, false, false, false]
        };

        // Web Audio API Sound Engine
        const soundFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playBeep(freq = 440, type = 'sine', duration = 0.15) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            correct() {
                this.playBeep(523.25, 'sine', 0.1);
                setTimeout(() => this.playBeep(659.25, 'sine', 0.15), 100);
                setTimeout(() => this.playBeep(783.99, 'sine', 0.25), 200);
            },
            wrong() {
                this.playBeep(220, 'sawtooth', 0.2);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.3), 150);
            },
            unlock() {
                [440, 554.37, 659.25, 880].forEach((f, i) => {
                    setTimeout(() => this.playBeep(f, 'triangle', 0.2), i * 120);
                });
            }
        };

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = message;
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-2xl text-center text-sm font-bold transition-all duration-300 border ${
                isSuccess 
                    ? 'bg-emerald-900/90 text-emerald-200 border-emerald-500/50 glow-green' 
                    : 'bg-rose-900/90 text-rose-200 border-rose-500/50 animate-shake'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function useHint(missionIndex, hintText) {
            if (gameState.hintsUsed[missionIndex - 1]) {
                showToast(`💡 Hint Misi ${missionIndex}: ${hintText}`, true);
                return;
            }
            gameState.hintsUsed[missionIndex - 1] = true;
            gameState.score = Math.max(0, gameState.score - 2);
            updateStatsUI();
            showToast(`💡 Hint Misi ${missionIndex} (-2 Markah): ${hintText}`, true);
        }

        function deductLife() {
            soundFX.wrong();
            gameState.lives--;
            gameState.wrongCount++;
            updateStatsUI();

            const container = document.getElementById('gameScreen');
            if (container) {
                container.classList.add('animate-shake');
                setTimeout(() => container.classList.remove('animate-shake'), 400);
            }

            if (gameState.wrongCount >= 3 || gameState.lives <= 0) {
                setTimeout(() => {
                    renderGameOver();
                }, 800);
            }
        }

        function showCodeUnlockModal(missionNum, codeDigit, badgeName, nextPage) {
            const modal = document.createElement('div');
            modal.id = 'codeModal';
            modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in';
            modal.innerHTML = `
                <div class="glass-panel p-6 sm:p-8 rounded-2xl max-w-md w-full text-center space-y-5 border-2 border-amber-400/60 glow-gold relative">
                    <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-3xl border border-amber-400/40 glow-gold">
                        🔑
                    </div>
                    <div>
                        <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold">MISI ${missionNum} SELESAI</span>
                        <h3 class="text-2xl font-black text-white mt-1">Kod Rahsia Diperoleh!</h3>
                    </div>
                    <div class="bg-forest-950 p-4 rounded-xl border border-forest-700/60 space-y-1">
                        <span class="text-xs text-slate-400 uppercase tracking-wider block">Digit Kod Ke-${missionNum}:</span>
                        <span class="text-5xl font-mono font-black text-amber-300 tracking-widest block">${codeDigit}</span>
                    </div>
                    <div class="p-2.5 bg-emerald-950/60 border border-emerald-500/30 rounded-lg text-xs font-semibold text-emerald-300 flex items-center justify-center gap-2">
                        <span>🎖️ Lencana:</span>
                        <span class="text-amber-300 font-bold">${badgeName}</span>
                    </div>
                    <button onclick="closeCodeModal(${nextPage})" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <span>${missionNum === 5 ? "Buka Cabaran Akhir" : "Teruskan Ke Misi Seterusnya"}</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeCodeModal(nextPage) {
            const modal = document.getElementById('codeModal');
            if (modal) modal.remove();
            goToPage(nextPage);
        }

        function completeMission(missionNum, codeDigit, points, badgeName) {
            if (gameState.codes[missionNum - 1] !== '_') return;
            soundFX.correct();
            gameState.codes[missionNum - 1] = codeDigit;
            gameState.score += points;
            if (!gameState.badges.includes(badgeName)) {
                gameState.badges.push(badgeName);
            }
            updateStatsUI();
            showCodeUnlockModal(missionNum, codeDigit, badgeName, missionNum + 2);
        }

        function updateStatsUI() {
            document.getElementById('livesDisplay').innerText = gameState.lives;
            document.getElementById('wrongDisplay').innerText = `(Salah: ${gameState.wrongCount}/3)`;
            document.getElementById('scoreDisplay').innerText = `${gameState.score}/80`;
            document.getElementById('codeInventory').innerText = gameState.codes.join(' ');
        }

        function renderPage1() {
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <div class="space-y-6 text-center sm:text-left">
                    <div class="flex flex-col sm:flex-row items-center gap-4 border-b border-forest-700/60 pb-4">
                        <div class="p-4 bg-emerald-500/20 text-emerald-400 rounded-2xl border border-emerald-500/30 text-4xl">
                            🌲
                        </div>
                        <div>
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">MISI: HUTAN MISTERI</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Escape From The Lost Forest</h2>
                        </div>
                    </div>

                    <div class="bg-forest-950/80 p-5 rounded-2xl border border-forest-700/60 space-y-3 text-sm text-slate-300 leading-relaxed text-justify sm:text-left">
                        <p>
                            Semasa menyertai aktiviti perkhemahan, kumpulan kamu telah tersesat jauh di dalam <strong class="text-emerald-400">Hutan Simpan Rimba Damai</strong>. Telefon tidak mempunyai isyarat, GPS gagal berfungsi dan semua laluan kelihatan sama.
                        </p>
                        <p>
                            Sebelum hilang, seorang renjer hutan sempat meninggalkan beberapa mesej rahsia yang telah dienkripsi supaya hanya orang yang memahami <strong class="text-amber-300">kriptografi</strong> dapat membacanya. Setiap mesej mengandungi petunjuk menuju ke laluan keluar.
                        </p>
                        <p class="text-amber-200/90 font-semibold bg-amber-950/40 p-3 rounded-xl border border-amber-500/30">
                            🧭 Misi Anda: Nyahsulit (decrypt) mesej rahsia, kumpulkan 5 kod rahsia, dan buka pintu keselamatan di pintu keluar hutan!
                        </p>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center text-xs">
                        <div class="bg-forest-900/60 p-3 rounded-xl border border-forest-700/50">
                            <span class="block text-lg">🧭</span>
                            <span class="font-bold text-amber-400">5 Nyawa</span>
                        </div>
                        <div class="bg-forest-900/60 p-3 rounded-xl border border-forest-700/50">
                            <span class="block text-lg">❌</span>
                            <span class="font-bold text-rose-400">Max 3 Salah</span>
                        </div>
                        <div class="bg-forest-900/60 p-3 rounded-xl border border-forest-700/50">
                            <span class="block text-lg">🔑</span>
                            <span class="font-bold text-emerald-400">5 Kod Rahsia</span>
                        </div>
                        <div class="bg-forest-900/60 p-3 rounded-xl border border-forest-700/50">
                            <span class="block text-lg">⭐</span>
                            <span class="font-bold text-emerald-300">80 Markah</span>
                        </div>
                    </div>

                    <button onclick="goToPage(2)" class="w-full py-4 bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-lg rounded-xl shadow-xl transition flex items-center justify-center gap-3">
                        <span>MULAKAN MISI</span>
                        <i class="fa-solid fa-compass animate-spin text-xl"></i>
                    </button>
                </div>
            `;
        }

        let mission1Pairs = { 'Enkripsi': null, 'Dekripsi': null, 'Ciphertext': null, 'Plaintext': null };
        let selectedTerm = null;

        function renderPage2() {
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between border-b border-forest-700/60 pb-4">
                        <div>
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Misi 1 (10 Markah)</span>
                            <h2 class="text-2xl font-bold text-white">Fahami Konsep Kriptografi</h2>
                        </div>
                        <button onclick="useHint(1, 'Fahami proses: Enkripsi menukar teks asal kepada sulit, Dekripsi menukar sulit kepada asal. Plaintext = asal, Ciphertext = sulit.')" class="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                            <span>💡 Hint</span>
                        </button>
                    </div>

                    <p class="text-sm text-slate-300">
                        Renjer meninggalkan sekeping nota. <strong class="text-amber-300">Klik / Sentuh</strong> istilah di sebelah kiri, kemudian pilih padanan jawapan yang betul di sebelah kanan.
                    </p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- ISTILAH COLUMN -->
                        <div class="space-y-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 block mb-1">Istilah Kriptografi</span>
                            ${['Enkripsi', 'Dekripsi', 'Ciphertext', 'Plaintext'].map(term => `
                                <div id="term-${term}" onclick="selectTerm('${term}')" class="p-3.5 bg-forest-900 border border-forest-600/60 rounded-xl cursor-pointer hover:border-amber-400 transition flex items-center justify-between text-sm font-bold">
                                    <span>${term}</span>
                                    <span id="badge-${term}" class="text-xs font-normal text-slate-400 truncate max-w-[120px]">${mission1Pairs[term] ? '✅ Linked' : '👈 Tekan'}</span>
                                </div>
                            `).join('')}
                        </div>

                        <!-- JAWAPAN COLUMN -->
                        <div class="space-y-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-amber-400 block mb-1">Jawapan Maksud</span>
                            ${[
                                { id: 'desc1', text: 'Menukar teks asal kepada teks sulit' },
                                { id: 'desc2', text: 'Menukar teks sulit kepada teks asal' },
                                { id: 'desc3', text: 'Teks yang telah disulitkan' },
                                { id: 'desc4', text: 'Teks asal' }
                            ].map(desc => `
                                <div id="${desc.id}" onclick="selectDesc('${desc.text}')" class="p-3.5 bg-forest-950 border border-forest-700/60 rounded-xl cursor-pointer hover:border-amber-400 transition text-xs text-slate-200">
                                    ${desc.text}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="pt-4 border-t border-forest-700/60 flex flex-wrap justify-between items-center gap-3">
                        <span class="text-xs text-slate-400">Kod diperoleh: <strong class="text-emerald-400">8</strong></span>
                        <div class="flex items-center gap-2">
                            <button onclick="checkMission1()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition text-sm flex items-center gap-2">
                                <span>Semak Padanan</span>
                                <i class="fa-solid fa-check"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectTerm(term) {
            selectedTerm = term;
            ['Enkripsi', 'Dekripsi', 'Ciphertext', 'Plaintext'].forEach(t => {
                const el = document.getElementById(`term-${t}`);
                if (el) el.classList.remove('selected-item');
            });
            const activeEl = document.getElementById(`term-${term}`);
            if (activeEl) activeEl.classList.add('selected-item');
            soundFX.playBeep(600, 'sine', 0.08);
        }

        function selectDesc(descText) {
            if (!selectedTerm) {
                showToast('Sila pilih Istilah di sebelah kiri terlebih dahulu!', false);
                return;
            }
            mission1Pairs[selectedTerm] = descText;
            const badge = document.getElementById(`badge-${selectedTerm}`);
            if (badge) {
                badge.innerText = `✅ Padan`;
                badge.className = "text-xs font-bold text-amber-300";
            }
            soundFX.playBeep(700, 'sine', 0.08);
            selectedTerm = null;
            ['Enkripsi', 'Dekripsi', 'Ciphertext', 'Plaintext'].forEach(t => {
                const el = document.getElementById(`term-${t}`);
                if (el) el.classList.remove('selected-item');
            });
        }

        function checkMission1() {
            const correct = {
                'Enkripsi': 'Menukar teks asal kepada teks sulit',
                'Dekripsi': 'Menukar teks sulit kepada teks asal',
                'Ciphertext': 'Teks yang telah disulitkan',
                'Plaintext': 'Teks asal'
            };
            let isComplete = true;
            for (let key in correct) {
                if (mission1Pairs[key] !== correct[key]) {
                    isComplete = false;
                    break;
                }
            }

            if (isComplete) {
                completeMission(1, '8', 10, 'Pakar Konsep');
            } else {
                deductLife();
                showToast('Padanan belum betul! Sila semak semula istilah & maksud.', false);
            }
        }

        function renderPage3() {
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between border-b border-forest-700/60 pb-4">
                        <div>
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Misi 2 (15 Markah)</span>
                            <h2 class="text-2xl font-bold text-white">Caesar Cipher (Shift +3)</h2>
                        </div>
                        <button onclick="useHint(2, 'Undurkan setiap huruf sebanyak 3 kedudukan ke belakang dalam susunan abjad A-Z (Contoh: M ➔ J, X ➔ U).')" class="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                            <span>💡 Hint</span>
                        </button>
                    </div>

                    <div class="bg-forest-900/80 p-4 rounded-xl border border-forest-700/60 space-y-2">
                        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">Nota Ciphertext Renjer:</span>
                        <div class="text-2xl sm:text-3xl font-mono font-bold text-amber-300 tracking-widest text-center py-2 bg-forest-950 rounded-lg border border-forest-700/80">
                            MXUXV NH VXQJDL
                        </div>
                        <p class="text-xs text-slate-300 text-center">
                            *Setiap huruf telah dianjak 3 kedudukan ke hadapan (+3). Undurkan 3 kedudukan (-3) untuk menyahsulit.
                        </p>
                    </div>

                    <!-- INPUT FORM - RUANG KOSONG TULIS JAWAPAN -->
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase text-slate-300 flex justify-between">
                            <span>Ruang Jawapan Dekripsi:</span>
                            <span class="text-amber-400 text-[11px] normal-case">*Taip jawapan menyahsulit di sini</span>
                        </label>
                        <input type="text" 
                               id="misi2Input" 
                               placeholder="TAIP JAWAPAN DI SINI..." 
                               onkeyup="if(event.key==='Enter') checkMission2();"
                               class="w-full px-4 py-3 bg-forest-950 border-2 border-forest-500 rounded-xl text-amber-300 font-mono font-bold text-base focus:outline-none focus:border-amber-400 transition placeholder:text-slate-600 uppercase">
                    </div>

                    <div class="pt-4 border-t border-forest-700/60 flex flex-wrap justify-between items-center gap-3">
                        <span class="text-xs text-slate-400">Kod diperoleh: <strong class="text-emerald-400">3</strong></span>
                        <div class="flex items-center gap-2">
                            <button onclick="checkMission2()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition text-sm flex items-center gap-2">
                                <span>Semak Jawapan</span>
                                <i class="fa-solid fa-check"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const el = document.getElementById('misi2Input');
                if (el) el.focus();
            }, 100);
        }

        function checkMission2() {
            const inputEl = document.getElementById('misi2Input');
            const rawValue = inputEl ? inputEl.value : '';

                    <!-- MAP REVEAL BOX -->
                    <div class="bg-forest-900/90 p-5 rounded-2xl border border-amber-500/40 space-y-3">
                        <div class="text-amber-400 font-bold text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-map-location-dot"></i>
                            <span>PETA KELUAR HUTAN SIMPAN RIMBA DAMAI</span>
                        </div>
                        <div class="bg-amber-950/40 p-4 rounded-xl border border-amber-500/20 text-xs text-amber-200/90 font-mono leading-relaxed text-left">
                            📍 LALUAN KELUAR: <br>
                            1. Ikut Sungai utama ➔ 2. Lintas Pokok Besar ➔ 3. Belok Kanan ke Pintu Sempadan Utama.
                        </div>
                    </div>

                    <!-- STATS SUMMARY CARD -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-left">
                        <div class="bg-forest-800/60 p-3 rounded-xl border border-forest-600/40">
                            <span class="text-xs text-slate-400 block">Baki Nyawa</span>
                            <span class="text-lg font-bold text-amber-400">🧭 ${gameState.lives} / 5</span>
                        </div>
                        <div class="bg-forest-800/60 p-3 rounded-xl border border-forest-600/40">
                            <span class="text-xs text-slate-400 block">Jumlah Markah (+10 Kerjasama)</span>
                            <span class="text-lg font-bold text-emerald-400">⭐ ${gameState.score} / 80 Pts</span>
                        </div>
                        <div class="col-span-2 sm:col-span-1 bg-forest-800/60 p-3 rounded-xl border border-forest-600/40">
                            <span class="text-xs text-slate-400 block">Lencana Diperoleh</span>
                            <span class="text-xs font-bold text-amber-300 block truncate">${gameState.badges.length} Lencana</span>
                        </div>
                    </div>

                    <!-- BADGES GRID -->
                    <div class="bg-forest-950 p-4 rounded-xl border border-forest-700/50">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Koleksi Lencana Kriptografi:</span>
                        <div class="flex flex-wrap justify-center gap-2">
                            ${gameState.badges.map(badge => `
                                <span class="px-3 py-1 bg-emerald-950 text-emerald-300 border border-emerald-500/40 rounded-lg text-xs font-bold flex items-center gap-1">
                                    🎖️ ${badge}
                                </span>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="resetGame()" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition text-base flex items-center justify-center gap-2 mx-auto">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Main Semula</span>
                    </button>
                </div>
            `;
        }

        function renderGameOver() {
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <div class="text-center space-y-6 py-8">
                    <div class="inline-block p-4 bg-rose-500/20 rounded-full border border-rose-500/40">
                        <span class="text-6xl">💀</span>
                    </div>
                    <div class="space-y-2">
                        <h2 class="text-3xl font-bold text-rose-400">Misi Gagal! Anda Sesat Di Hutan</h2>
                        <p class="text-slate-300 text-sm">Jawapan salah telah melebihi 3 kali! Kumpulan anda telah tersesat di dalam Hutan Simpan Rimba Damai.</p>
                    </div>
                    <button onclick="resetGame()" class="px-8 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg transition text-base flex items-center justify-center gap-2 mx-auto">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Cuba Lagi</span>
                    </button>
                </div>
            `;
        }

        function resetGame() {
            gameState.currentPage = 1;
            gameState.lives = 5;
            gameState.wrongCount = 0;
            gameState.score = 0;
            gameState.codes = ['_', '_', '_', '_', '_'];
            gameState.badges = [];
            gameState.hintsUsed = [false, false, false, false, false];
            mission1Pairs = { 'Enkripsi': null, 'Dekripsi': null, 'Ciphertext': null, 'Plaintext': null };
            selectedTerm = null;
            updateStatsUI();
            goToPage(1);
        }

        function goToPage(pageNum) {
            if (pageNum === 7 && !gameState.codes.every(c => c !== '_')) {
                showToast('🔒 Selesaikan semua 5 misi untuk membuka peti keselamatan.', false);
                return;
            }
            if (pageNum === 8 && gameState.codes.some(c => c === '_')) {
                showToast('🔒 Selesaikan semua misi dan masukkan kod yang betul dahulu.', false);
                return;
            }
            gameState.currentPage = pageNum;
            switch(pageNum) {
                case 1: renderPage1(); break;
                case 2: renderPage2(); break;
                case 3: renderPage3(); break;
                case 4: renderPage4(); break;
                case 5: renderPage5(); break;
                case 6: renderPage6(); break;
                case 7: renderPage7(); break;
                case 8: renderPage8(); break;
                default: renderPage1(); break;
            }
        }

        // Initialize game on window load
        window.onload = function() {
            updateStatsUI();
            goToPage(1);
        };
    </script>
</body>
</html>
